name: Godot Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  export-game:
    runs-on: ubuntu-latest
    name: Export Game
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export Game
        uses: barichello/godot-ci@master
        with:
          godot_version: 4.2

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./.godot/export/
          
